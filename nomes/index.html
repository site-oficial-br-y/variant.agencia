<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomes do Brasil — Consulta</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f3f5f8;color:#1b2733;
  min-height:100vh}
.topo{background:linear-gradient(135deg,#1769d1,#0b4ea0);color:#fff;padding:22px 18px 26px}
.topo .marca{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.topo .bola{width:34px;height:34px;border-radius:8px;background:#fff;color:#1769d1;
  display:grid;place-items:center;font-weight:900;font-size:20px}
.topo h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.topo p{max-width:760px;margin:6px auto 0;font-size:13px;opacity:.9;padding-left:44px}
.busca-wrap{max-width:760px;margin:-20px auto 0;padding:0 18px}
.busca{display:flex;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(16,42,80,.15);
  overflow:hidden}
.busca input{flex:1;border:0;padding:16px 18px;font-size:16px;outline:none}
.busca button{border:0;background:#1769d1;color:#fff;font-weight:800;font-size:15px;
  padding:0 24px;cursor:pointer}
.busca button:active{background:#0b4ea0}
.conteudo{max-width:760px;margin:22px auto;padding:0 18px}
.dica{font-size:13px;color:#6b7a8d;text-align:center;margin-bottom:18px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(16,42,80,.08);
  padding:22px;margin-bottom:16px;animation:sobe .35s ease}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nome{font-size:26px;font-weight:900;letter-spacing:-.6px;color:#0b2d52}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#1769d1;
  background:#e8f1fd;padding:4px 10px;border-radius:999px}
.nota{margin-top:12px;font-size:13px;font-weight:700;color:#b26a00;background:#fff6e5;
  border:1px solid #ffe0a3;border-radius:10px;padding:10px 12px}
.linha-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.stat{background:#f6f8fb;border-radius:10px;padding:14px}
.stat .n{font-size:24px;font-weight:900;color:#0b2d52}
.stat .l{font-size:12px;color:#6b7a8d;margin-top:2px}
.barra-tit{font-size:13px;font-weight:700;color:#44566b;margin:20px 0 10px}
.estado{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.estado .uf{width:34px;font-weight:800;color:#0b2d52}
.estado .track{flex:1;height:9px;background:#e9eef4;border-radius:999px;overflow:hidden}
.estado .fill{height:100%;background:linear-gradient(90deg,#1769d1,#3f8ae0);border-radius:999px;
  width:0;transition:width .6s ease}
.estado .pc{width:44px;text-align:right;color:#6b7a8d;font-weight:700}
.rodape-nota{font-size:11px;color:#9aa7b5;text-align:center;margin:24px 0}
.vazio{text-align:center;color:#6b7a8d;padding:30px 0}
.vazio .emo{font-size:40px}
</style>
</head>
<body>
  <div class="topo">
    <div class="marca">
      <div class="bola">N</div>
      <h1>Nomes do Brasil</h1>
    </div>
    <p>Consulte a frequência e a distribuição de qualquer nome registrado no país.</p>
  </div>

  <div class="busca-wrap">
    <form class="busca" id="form">
      <input id="q" placeholder="Digite um nome (ex: Maria, João...)" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="conteudo">
    <div class="dica">Mais de 212 milhões de registros na base nacional.</div>
    <div id="resultado"></div>
    <div class="rodape-nota">Base consolidada de registros civis · atualizada periodicamente</div>
  </div>

<script>
/* Tira acento e deixa minúsculo, pra a busca casar com qualquer jeito de digitar. */
function limpar(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}

/* ---------- a brincadeira ----------
   Quando a busca tem alguma destas palavras, aparece este nome. É só editar o
   texto e as palavras pra montar outra pegadinha. */
const PEGADINHAS = [
  {
    gatilhos: ['perine', 'gordinha', 'gordinha perine', 'lucas perine'],
    nome: 'Lucas Perinê Gordinha da Silva Pinto',
    total: 1,
    decada: 2026,
    estados: [['SP', 100]],
    nota: 'Ainda não nascido — registrado pela mãe no cartório',
  },
]

/* Nomes "de verdade" pra base parecer real quando pesquisam outra coisa. */
const COMUNS = ['Maria','José','Ana','João','Antônio','Francisco','Carlos','Paulo',
  'Pedro','Lucas','Luiz','Marcos','Gabriel','Rafael','Daniel','Marcelo','Bruno',
  'Eduardo','Felipe','Rodrigo','Juliana','Fernanda','Patrícia','Aline','Camila']

const UFS = ['SP','MG','RJ','BA','RS','PR','PE','CE','PA','SC']

function sortear(nome){
  // número estável a partir do nome, pra a mesma busca dar sempre o mesmo resultado
  let h=0; for(const c of nome) h=(h*31+c.charCodeAt(0))>>>0
  const total = 1200 + (h % 980000)
  const decada = 1950 + (h % 7)*10
  // distribuição por estado
  const ufs = [...UFS].sort(()=>((h=(h*1103515245+12345)>>>0)%2)-0.5).slice(0,5)
  let resto=100, estados=[]
  ufs.forEach((uf,i)=>{ const p = i===ufs.length-1?resto:Math.max(6,Math.round(resto*(0.3+((h>>i)%30)/100))); resto-=p; estados.push([uf,p]) })
  return {nome, total, decada, estados}
}

function card(d){
  const r = document.getElementById('resultado')
  const estados = d.estados.map(([uf,p])=>`
    <div class="estado"><span class="uf">${uf}</span>
      <span class="track"><span class="fill" data-p="${p}"></span></span>
      <span class="pc">${p}%</span></div>`).join('')
  r.innerHTML = `
    <div class="card">
      <div class="nome">${d.nome}</div>
      <span class="tag">Nome registrado</span>
      ${d.nota?`<div class="nota">⚠️ ${d.nota}</div>`:''}
      <div class="linha-stats">
        <div class="stat"><div class="n">${d.total.toLocaleString('pt-BR')}</div><div class="l">pessoas no Brasil</div></div>
        <div class="stat"><div class="n">${d.decada}s</div><div class="l">década mais comum</div></div>
      </div>
      <div class="barra-tit">Onde mais aparece</div>
      ${estados}
    </div>`
  requestAnimationFrame(()=>r.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.p+'%'))
}

function buscar(texto){
  const t = limpar(texto)
  if(!t){document.getElementById('resultado').innerHTML='';return}
  // primeiro procura uma pegadinha
  for(const p of PEGADINHAS){
    if(p.gatilhos.some(g=>t.includes(limpar(g)))){ card(p); return }
  }
  // senão, se bater com um nome comum, mostra um resultado "de verdade"
  const achou = COMUNS.find(n=>limpar(n)===t || limpar(n).startsWith(t))
  if(achou){ card(sortear(achou)); return }
  // nada encontrado
  document.getElementById('resultado').innerHTML =
    `<div class="card vazio"><div class="emo">🔎</div>
     <div style="font-weight:700;margin-top:8px">Nenhum registro encontrado para "<b>${texto}</b>"</div>
     <div style="font-size:13px;margin-top:4px">Confira a grafia e tente de novo.</div></div>`
}

document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault()
  buscar(document.getElementById('q').value)
})
</script>
</body>
</html>
