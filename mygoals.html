<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>my goals</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a26;
  --card:#1e1e2e;
  --card2:#252535;
  --purple:#7c6ff7;
  --purple2:#9d8fff;
  --purple-dim:rgba(124,111,247,0.15);
  --green:#4ade80;
  --yellow:#fbbf24;
  --red:#f87171;
  --text:#ffffff;
  --text2:rgba(255,255,255,0.6);
  --text3:rgba(255,255,255,0.3);
  --border:rgba(255,255,255,0.06);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.app{width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);}
@media(min-width:500px){body{display:flex;align-items:center;justify-content:center;min-height:100vh;}.app{height:860px;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,0.6);border:1px solid var(--border);}}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}

/* TOP BAR */
.topbar{padding:20px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.topbar-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.topbar-btn{width:38px;height:38px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.topbar-btn:hover{background:var(--card2);}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;transition:color .2s,transform .2s;border-radius:12px;}
.nav-item:hover{color:var(--purple2);transform:translateY(-2px);}
.nav-item.active{color:var(--purple);}
.nav-item svg{width:22px;height:22px;transition:transform .2s;}
.nav-item:hover svg{transform:scale(1.15);}
.nav-item.active svg{filter:drop-shadow(0 0 6px rgba(124,111,247,0.5));}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--border);margin-bottom:12px;}

/* ── TELA HOJE ── */
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;flex-shrink:0;}
.date-strip::-webkit-scrollbar{display:none;}
.date-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:8px 4px;border-radius:14px;cursor:pointer;transition:background .15s;flex-shrink:0;}
.date-day.today{background:var(--purple);box-shadow:0 4px 16px rgba(124,111,247,0.4);}
.date-day .weekday{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.date-day.today .weekday{color:rgba(255,255,255,0.8);}
.date-day .daynum{font-size:16px;font-weight:700;}
.date-day .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.date-day.has-green .dot{background:var(--green);}
.date-day.has-yellow .dot{background:var(--yellow);}
.date-day.has-red .dot{background:var(--red);}

.section-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;}

.goal-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:16px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:background .15s,border-color .15s;}
.goal-item:hover{background:var(--card2);}
.goal-item.done{border-color:rgba(74,222,128,0.2);background:rgba(74,222,128,0.04);}
.goal-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.goal-info{flex:1;}
.goal-name{font-size:15px;font-weight:600;}
.goal-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.goal-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.goal-item.done .goal-check{background:var(--green);border-color:var(--green);}
.goal-check svg{width:14px;height:14px;opacity:0;}
.goal-item.done .goal-check svg{opacity:1;}

.progress-bar-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:8px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple),var(--purple2));transition:width .4s;}

/* ── TELA METAS ── */
.meta-card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--border);margin-bottom:10px;}
.meta-card-top{display:flex;align-items:center;gap:10px;}
.meta-card-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.meta-card-info{flex:1;}
.meta-card-name{font-size:15px;font-weight:700;}
.meta-card-type{font-size:11px;color:var(--text2);margin-top:2px;}
.meta-card-actions{display:flex;gap:6px;}
.meta-action-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.meta-action-btn:hover{background:var(--card2);}
.meta-progress-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.meta-pct{font-size:12px;font-weight:700;color:var(--purple2);min-width:32px;}
.streak-badge{display:flex;align-items:center;gap:4px;background:var(--purple-dim);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--purple2);font-weight:600;}

.fab{position:absolute;bottom:80px;right:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#a78bfa);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(124,111,247,0.5);transition:transform .2s,box-shadow .2s;z-index:10;}
.fab:hover{transform:scale(1.08);box-shadow:0 8px 28px rgba(124,111,247,0.6);}
.fab:active{transform:scale(.95);}

/* ── TELA CALENDÁRIO ── */
.cal-month{font-size:18px;font-weight:700;text-align:center;margin-bottom:16px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav-btn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2);transition:background .15s;}
.cal-nav-btn:hover{background:var(--card2);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-wday{text-align:center;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;padding:4px 0;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;position:relative;transition:background .15s;}
.cal-cell.today{background:var(--purple);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(124,111,247,.4);}
.cal-cell.green{background:rgba(74,222,128,0.2);color:var(--green);}
.cal-cell.yellow{background:rgba(251,191,36,0.2);color:var(--yellow);}
.cal-cell.red{background:rgba(248,113,113,0.2);color:var(--red);}
.cal-cell.empty{opacity:0;}
.cal-legend{display:flex;gap:16px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.cal-legend-dot{width:10px;height:10px;border-radius:50%;}

/* ── TELA RELATÓRIO ── */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border);}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.stat-value.purple{color:var(--purple2);}
.stat-value.green{color:var(--green);}

.donut-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0;}
.donut-pct{font-size:32px;font-weight:900;margin-top:-60px;letter-spacing:-1px;}
.donut-label{font-size:13px;color:var(--text2);margin-top:4px;}

.report-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.report-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.report-info{flex:1;}
.report-name{font-size:13px;font-weight:600;}
.report-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:5px;overflow:hidden;}
.report-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--purple2));}
.report-pct{font-size:12px;font-weight:700;color:var(--purple2);min-width:32px;text-align:right;}

/* ── MODAL CRIAR META ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:28px 28px 0 0;padding:24px 20px max(24px,env(safe-area-inset-bottom));width:100%;max-width:430px;border-top:1px solid var(--border);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal label{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:6px;}
.modal input,.modal select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:13px 14px;color:var(--text);font-size:15px;outline:none;margin-bottom:14px;transition:border-color .2s;}
.modal input:focus,.modal select:focus{border-color:var(--purple);}
.modal select option{background:var(--bg2);}
.modal-emoji-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.emoji-btn{width:40px;height:40px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
.emoji-btn.selected{border-color:var(--purple);background:var(--purple-dim);}
.type-row{display:flex;gap:8px;margin-bottom:14px;}
.type-btn{flex:1;padding:11px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
.type-btn.selected{background:var(--purple-dim);border-color:var(--purple);color:var(--purple2);}
.modal-save{width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--purple),#a78bfa);border:none;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.modal-save:hover{opacity:.9;}
</style>
</head>
<body>
<div class="app">

<!-- MODAL CRIAR META -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nova meta</div>

    <label>Emoji</label>
    <div class="modal-emoji-row" id="emoji-row">
      <button class="emoji-btn selected" data-emoji="🎯">🎯</button>
      <button class="emoji-btn" data-emoji="💪">💪</button>
      <button class="emoji-btn" data-emoji="📚">📚</button>
      <button class="emoji-btn" data-emoji="🏃">🏃</button>
      <button class="emoji-btn" data-emoji="🥗">🥗</button>
      <button class="emoji-btn" data-emoji="😴">😴</button>
      <button class="emoji-btn" data-emoji="💧">💧</button>
      <button class="emoji-btn" data-emoji="🧘">🧘</button>
    </div>

    <label>Nome da meta</label>
    <input id="meta-name" placeholder="Ex: Sem açúcar, Academia..."/>

    <label>Tipo</label>
    <div class="type-row">
      <button class="type-btn selected" data-type="diaria">Diária</button>
      <button class="type-btn" data-type="prazo">Com prazo</button>
    </div>

    <div id="prazo-field" style="display:none;">
      <label>Data limite</label>
      <input type="date" id="meta-prazo"/>
    </div>

    <button class="modal-save" onclick="saveMeta()">Criar meta</button>
  </div>
</div>

<!-- ══ TELA 1: HOJE ══ -->
<div class="screen active" id="screen-hoje">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="hoje-title">Hoje</div>
      <div class="topbar-sub" id="hoje-date"></div>
    </div>
    <div class="topbar-btn" onclick="openModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <div style="padding:0 16px; flex-shrink:0;">
    <div class="date-strip" id="date-strip"></div>
  </div>

  <div class="scroll" id="hoje-scroll">
    <div class="section-label">Suas metas de hoje</div>
    <div id="goals-list"></div>
    <div id="empty-state" style="text-align:center;padding:40px 20px;display:none;">
      <div style="font-size:48px;margin-bottom:12px;">🎯</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:6px;">Nenhuma meta ainda</div>
      <div style="font-size:13px;color:var(--text2);">Toque no + para criar sua primeira meta</div>
    </div>
  </div>

  <div class="bottom-nav" id="nav-hoje">
    <div class="nav-item active" onclick="goTo('hoje')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Hoje</span>
    </div>
    <div class="nav-item" onclick="goTo('metas')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>Metas</span>
    </div>
    <div class="nav-item" onclick="goTo('calendario')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H3M16 2v4M8 2v4M3 6h18v16H3z"/></svg>
      <span>Calendário</span>
    </div>
    <div class="nav-item" onclick="goTo('relatorio')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Relatórios</span>
    </div>
  </div>
</div>

<!-- ══ TELA 2: METAS ══ -->
<div class="screen" id="screen-metas">
  <div class="topbar">
    <div>
      <div class="topbar-title">Metas</div>
      <div class="topbar-sub" id="metas-count"></div>
    </div>
    <div class="topbar-btn" onclick="openModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>
  <div class="scroll" id="metas-list"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="goTo('hoje')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Hoje</span></div>
    <div class="nav-item active" onclick="goTo('metas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Metas</span></div>
    <div class="nav-item" onclick="goTo('calendario')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H3M16 2v4M8 2v4M3 6h18v16H3z"/></svg><span>Calendário</span></div>
    <div class="nav-item" onclick="goTo('relatorio')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Relatórios</span></div>
  </div>
</div>

<!-- ══ TELA 3: CALENDÁRIO ══ -->
<div class="screen" id="screen-calendario">
  <div class="topbar"><div class="topbar-title">Calendário</div></div>
  <div class="scroll">
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="cal-month" id="cal-month-label"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div>Todas cumpridas</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--yellow)"></div>Parcial</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--red)"></div>Poucas cumpridas</div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="goTo('hoje')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Hoje</span></div>
    <div class="nav-item" onclick="goTo('metas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Metas</span></div>
    <div class="nav-item active" onclick="goTo('calendario')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H3M16 2v4M8 2v4M3 6h18v16H3z"/></svg><span>Calendário</span></div>
    <div class="nav-item" onclick="goTo('relatorio')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Relatórios</span></div>
  </div>
</div>

<!-- ══ TELA 4: RELATÓRIOS ══ -->
<div class="screen" id="screen-relatorio">
  <div class="topbar"><div class="topbar-title">Relatórios</div></div>
  <div class="scroll" id="relatorio-content"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="goTo('hoje')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Hoje</span></div>
    <div class="nav-item" onclick="goTo('metas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Metas</span></div>
    <div class="nav-item" onclick="goTo('calendario')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10H3M16 2v4M8 2v4M3 6h18v16H3z"/></svg><span>Calendário</span></div>
    <div class="nav-item active" onclick="goTo('relatorio')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Relatórios</span></div>
  </div>
</div>

</div><!-- /app -->

<script>
// ── STATE ──
let state = {
  metas: [],
  logs: {},        // { "YYYY-MM-DD": { metaId: true/false } }
  selectedDate: todayStr(),
  calMonth: new Date()
};

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function load() {
  const s = localStorage.getItem('mygoals');
  if (s) state = {...state, ...JSON.parse(s)};
  state.calMonth = new Date();
}

function save() {
  localStorage.setItem('mygoals', JSON.stringify({metas:state.metas, logs:state.logs}));
}

// ── NAVIGATION ──
function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  if(screen==='hoje') renderHoje();
  if(screen==='metas') renderMetas();
  if(screen==='calendario') renderCal();
  if(screen==='relatorio') renderRelatorio();
}

// ── MODAL ──
let selectedEmoji = '🎯', selectedType = 'diaria';

function openModal() {
  selectedEmoji = '🎯'; selectedType = 'diaria';
  document.getElementById('meta-name').value = '';
  document.getElementById('meta-prazo').value = '';
  document.getElementById('prazo-field').style.display = 'none';
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.toggle('selected', b.dataset.emoji==='🎯'));
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('selected', b.dataset.type==='diaria'));
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

document.getElementById('emoji-row').addEventListener('click', e => {
  const btn = e.target.closest('.emoji-btn');
  if(!btn) return;
  selectedEmoji = btn.dataset.emoji;
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
});

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('prazo-field').style.display = selectedType==='prazo' ? 'block' : 'none';
  });
});

function saveMeta() {
  const name = document.getElementById('meta-name').value.trim();
  if(!name) { document.getElementById('meta-name').focus(); return; }
  const meta = {
    id: Date.now(),
    name,
    emoji: selectedEmoji,
    type: selectedType,
    prazo: selectedType==='prazo' ? document.getElementById('meta-prazo').value : null,
    createdAt: todayStr()
  };
  state.metas.push(meta);
  save();
  closeModal();
  renderHoje();
  renderMetas();
}

function deleteMeta(id) {
  if(!confirm('Remover esta meta?')) return;
  state.metas = state.metas.filter(m => m.id !== id);
  save();
  renderMetas();
  renderHoje();
}

// ── TELA HOJE ──
function renderHoje() {
  // Date
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const today = new Date();
  document.getElementById('hoje-date').textContent = `${today.getDate()} de ${months[today.getMonth()]}`;

  // Date strip (7 dias)
  const strip = document.getElementById('date-strip');
  strip.innerHTML = '';
  for(let i=-3; i<=3; i++) {
    const d = new Date(); d.setDate(d.getDate()+i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const log = state.logs[ds] || {};
    const total = state.metas.length;
    const done = state.metas.filter(m => log[m.id]).length;
    let dotClass = '';
    if(total > 0 && ds <= todayStr()) {
      const ratio = done/total;
      if(ratio === 1) dotClass = 'has-green';
      else if(ratio >= 0.5) dotClass = 'has-yellow';
      else if(ratio > 0) dotClass = 'has-red';
    }
    const el = document.createElement('div');
    el.className = `date-day ${i===0?'today':''} ${dotClass}`;
    el.innerHTML = `<span class="weekday">${days[d.getDay()]}</span><span class="daynum">${d.getDate()}</span><div class="dot"></div>`;
    el.addEventListener('click', () => { state.selectedDate = ds; renderHoje(); });
    strip.appendChild(el);
  }

  // Goals list
  const list = document.getElementById('goals-list');
  const empty = document.getElementById('empty-state');
  list.innerHTML = '';
  if(state.metas.length === 0) { empty.style.display='block'; return; }
  empty.style.display='none';

  const log = state.logs[state.selectedDate] || {};
  const done = state.metas.filter(m => log[m.id]).length;
  const total = state.metas.length;

  // Progress
  const prog = document.createElement('div');
  prog.style.marginBottom = '12px';
  prog.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
      <span style="color:var(--text2)">Progresso do dia</span>
      <span style="color:var(--purple2);font-weight:700">${done}/${total}</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${total?Math.round(done/total*100):0}%"></div></div>
  `;
  list.appendChild(prog);

  state.metas.forEach(meta => {
    const isDone = !!log[meta.id];
    const el = document.createElement('div');
    el.className = `goal-item ${isDone?'done':''}`;
    let sub = meta.type === 'diaria' ? 'Meta diária' : (meta.prazo ? `Até ${meta.prazo.split('-').reverse().join('/')}` : 'Com prazo');
    el.innerHTML = `
      <div class="goal-icon" style="background:rgba(124,111,247,0.15)">${meta.emoji}</div>
      <div class="goal-info">
        <div class="goal-name">${meta.name}</div>
        <div class="goal-sub">${sub}</div>
      </div>
      <div class="goal-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    `;
    el.addEventListener('click', () => toggleGoal(meta.id));
    list.appendChild(el);
  });
}

function toggleGoal(id) {
  if(!state.logs[state.selectedDate]) state.logs[state.selectedDate] = {};
  state.logs[state.selectedDate][id] = !state.logs[state.selectedDate][id];
  save();
  renderHoje();
}

// ── TELA METAS ──
function renderMetas() {
  const list = document.getElementById('metas-list');
  document.getElementById('metas-count').textContent = `${state.metas.length} meta${state.metas.length!==1?'s':''}`;
  list.innerHTML = '';
  if(state.metas.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:60px 20px"><div style="font-size:52px;margin-bottom:12px">🎯</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">Nenhuma meta ainda</div><div style="font-size:13px;color:var(--text2)">Toque no + para criar sua primeira meta</div></div>`;
    return;
  }
  state.metas.forEach(meta => {
    const logs = Object.values(state.logs).filter(l => l[meta.id]).length;
    const total = Object.keys(state.logs).length || 1;
    const pct = Math.round(logs/Math.max(total,1)*100);
    const streak = calcStreak(meta.id);
    const el = document.createElement('div');
    el.className = 'meta-card';
    el.innerHTML = `
      <div class="meta-card-top">
        <div class="meta-card-icon" style="background:var(--purple-dim)">${meta.emoji}</div>
        <div class="meta-card-info">
          <div class="meta-card-name">${meta.name}</div>
          <div class="meta-card-type">${meta.type==='diaria'?'Meta diária':'Com prazo'}</div>
        </div>
        <div class="meta-card-actions">
          <div class="meta-action-btn" onclick="deleteMeta(${meta.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </div>
        </div>
      </div>
      <div class="meta-progress-row">
        <div class="progress-bar-wrap" style="flex:1"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="meta-pct">${pct}%</div>
        ${streak>0?`<div class="streak-badge">🔥 ${streak}</div>`:''}
      </div>
    `;
    list.appendChild(el);
  });
}

function calcStreak(metaId) {
  let streak = 0;
  const d = new Date();
  while(true) {
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(state.logs[ds] && state.logs[ds][metaId]) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

// ── TELA CALENDÁRIO ──
function renderCal() {
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const m = state.calMonth;
  document.getElementById('cal-month-label').textContent = `${months[m.getMonth()]} ${m.getFullYear()}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['D','S','T','Q','Q','S','S'].forEach(w => {
    const el = document.createElement('div');
    el.className = 'cal-wday';
    el.textContent = w;
    grid.appendChild(el);
  });
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const last = new Date(m.getFullYear(), m.getMonth()+1, 0);
  const today = todayStr();
  for(let i=0; i<first.getDay(); i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=last.getDate(); d++) {
    const ds = `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    const log = state.logs[ds] || {};
    const total = state.metas.length;
    const done = state.metas.filter(mt => log[mt.id]).length;
    let cls = 'cal-cell';
    if(ds === today) cls += ' today';
    else if(total > 0 && ds < today) {
      const r = done/total;
      if(r===1) cls += ' green';
      else if(r>=0.5) cls += ' yellow';
      else if(r>0) cls += ' red';
    }
    el.className = cls;
    el.textContent = d;
    grid.appendChild(el);
  }
}

function changeMonth(dir) {
  state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+dir, 1);
  renderCal();
}

// ── TELA RELATÓRIO ──
function renderRelatorio() {
  const el = document.getElementById('relatorio-content');
  const total = state.metas.length;
  const logDays = Object.keys(state.logs).filter(d => d <= todayStr());
  const totalDays = logDays.length || 1;
  let totalChecks = 0, totalPossible = total * totalDays;
  logDays.forEach(d => {
    state.metas.forEach(m => { if(state.logs[d][m.id]) totalChecks++; });
  });
  const pct = totalPossible > 0 ? Math.round(totalChecks/totalPossible*100) : 0;
  const streak = state.metas.length > 0 ? Math.max(...state.metas.map(m => calcStreak(m.id))) : 0;

  let metasHtml = state.metas.map(meta => {
    const done = logDays.filter(d => state.logs[d][meta.id]).length;
    const p = Math.round(done/totalDays*100);
    return `
      <div class="report-item">
        <div class="report-icon" style="background:var(--purple-dim)">${meta.emoji}</div>
        <div class="report-info">
          <div class="report-name">${meta.name}</div>
          <div class="report-bar-bg"><div class="report-bar-fill" style="width:${p}%"></div></div>
        </div>
        <div class="report-pct">${p}%</div>
      </div>`;
  }).join('');

  // SVG donut
  const r=54, circ=2*Math.PI*r, dashArr=`${circ*pct/100} ${circ}`;
  const msg = pct>=80?'Excelente! 🚀':pct>=50?'Muito bom! 💪':pct>=30?'Continue assim! 🎯':'Vamos lá! 🔥';

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Metas ativas</div><div class="stat-value purple">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Sequência atual</div><div class="stat-value green">🔥 ${streak}</div></div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:16px;">Desempenho geral</div>
      <div class="donut-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
          <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#pg)" stroke-width="12"
            stroke-dasharray="${dashArr}" stroke-dashoffset="${circ*0.25}" stroke-linecap="round"/>
          <defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c6ff7"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
          <text x="70" y="76" text-anchor="middle" font-size="26" font-weight="900" fill="white">${pct}%</text>
        </svg>
        <div class="donut-label">${msg}</div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:14px;">Desempenho por meta</div>
      ${metasHtml || '<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px 0;">Nenhuma meta criada ainda</div>'}
    </div>
  `;
}

// ── INIT ──
load();
renderHoje();
</script>
</body>
</html>
